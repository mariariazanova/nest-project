services:
  # ==================== INFRASTRUCTURE ====================

  # PostgreSQL - Auth Service
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Suggestion Service
  postgres-suggestions:
    image: postgres:15-alpine
    container_name: postgres-suggestions
    environment:
      POSTGRES_DB: suggestions_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-suggestions-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Favorite Service
  postgres-favorites:
    image: postgres:15-alpine
    container_name: postgres-favorites
    environment:
      POSTGRES_DB: favorites_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-favorites-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - History Service
  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: history_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - microservices-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass redispass
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbitpass
      RABBITMQ_ERLANG_COOKIE: secretcookie
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservices-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # Consul - Service Discovery & Configuration
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "8500:8500"   # HTTP API & UI
      - "8600:8600"   # DNS
    volumes:
      - consul-data:/consul/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MICROSERVICES ====================

  # Auth Service
  auth-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfile.nx-services
      args:
        SERVICE_NAME: auth-service
        SERVICE_PORT: 3001
    container_name: auth-service
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres-auth
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispass
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRATION=1d
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - RABBITMQ_URL=amqp://rabbit:rabbitpass@rabbitmq:5672
      - SERVICE_HOST=auth-service
      - CRYPT_SALT=10
#    ports:
#      - "3001:3001"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Suggestion Service
  suggestion-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfile.nx-services
      args:
        SERVICE_NAME: suggestion-service
        SERVICE_PORT: 3002
    container_name: suggestion-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DB_HOST=postgres-suggestions
      - DB_PORT=5432
      - DB_NAME=suggestions_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispass
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - RABBITMQ_URL=amqp://rabbit:rabbitpass@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3001
      - SERVICE_HOST=suggestion-service
#    ports:
#      - "3002:3002"
    depends_on:
      postgres-suggestions:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # History Service
  history-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfile.nx-services
      args:
        SERVICE_NAME: history-service
        SERVICE_PORT: 3003
    container_name: history-service
    environment:
      - NODE_ENV=development
      - PORT=3003
      - MONGODB_URI=mongodb://root:rootpass@mongodb:27017/history_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispass
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - RABBITMQ_URL=amqp://rabbit:rabbitpass@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3001
      - SUGGESTION_SERVICE_URL=http://suggestion-service:3002
      - SERVICE_HOST=history-service
#    ports:
#      - "3003:3003"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Favorite Service
  favorite-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfile.nx-services
      args:
        SERVICE_NAME: favorite-service
        SERVICE_PORT: 3004
    container_name: favorite-service
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DB_HOST=postgres-favorites
      - DB_PORT=5432
      - DB_NAME=favorites_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispass
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_HOST=favorite-service
      - CORS_ORIGIN=*
#    ports:
#      - "3004:3004"
    depends_on:
      postgres-favorites:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend
  frontend:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfile.frontend
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfile.nx-services
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 3000
    container_name: api-gateway
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispass
      - AUTH_SERVICE_URL=http://auth-service:3001
      - SUGGESTION_SERVICE_URL=http://suggestion-service:3002
      - HISTORY_SERVICE_URL=http://history-service:3003
      - FAVORITE_SERVICE_URL=http://favorite-service:3004
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - SERVICE_HOST=api-gateway
      - CORS_ORIGIN=*
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      suggestion-service:
        condition: service_healthy
      history-service:
        condition: service_healthy
      favorite-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==================== MONITORING ====================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - microservices-network
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3050:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - microservices-network
    restart: unless-stopped

  # Jaeger - Distributed Tracing
#  jaeger:
#    image: jaegertracing/all-in-one:latest
#    container_name: jaeger
#    environment:
#      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
#    ports:
#      - "5775:5775/udp"
#      - "6831:6831/udp"
#      - "6832:6832/udp"
#      - "5778:5778"
#      - "16686:16686"  # UI
#      - "14268:14268"
#      - "14250:14250"
#      - "9411:9411"
#    networks:
#      - microservices-network
#    restart: unless-stopped

volumes:
  postgres-auth-data:
  postgres-suggestions-data:
  postgres-favorites-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  consul-data:
  prometheus-data:
  grafana-data:

networks:
  microservices-network:
    driver: bridge
    name: microservices-network

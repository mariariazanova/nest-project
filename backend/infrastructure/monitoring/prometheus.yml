global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'suggestion-service'
    static_configs:
      - targets: ['suggestion-service:3002']
    metrics_path: '/metrics'

  - job_name: 'history-service'
    static_configs:
      - targets: ['history-service:3003']
    metrics_path: '/metrics'

  - job_name: 'favorite-service'
    static_configs:
      - targets: [ 'favorite-service:3004' ]
    metrics_path: '/metrics'
